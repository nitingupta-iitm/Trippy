[project]
name = "trippy"
version = "0.1.0"
description = "Multi-Agent Travel Itinerary System built with LangGraph"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Core orchestration
    "langgraph>=0.0.1",
    "langchain>=0.1.0",
    "langchain-core>=0.1.0",
    
    # LLM providers
    "langchain-openai>=0.1.0",
    "anthropic>=0.7.0",
    
    # Data models
    "pydantic>=2.0.0",
    
    # Environment variables
    "python-dotenv>=1.0.0",
    "pydantic-settings>=2.0.0",
]
